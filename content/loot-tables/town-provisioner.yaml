schemaVersion: 14
entries:
  - kind: loot-table
    id: loot-table.town-provisioner
    name: Town Provisioner stock
    tags: [town, provisioner]
    rolls: 4
    # Base band (no minDepth/maxDepth) is always available. Deeper bands widen the pool as the
    # run descends: the brass lantern from depth 5, then from depth 10 the two goods that deep
    # locks make expensive - a tarnished key (the guaranteed open) and the warded lantern, the
    # only light in the pack that outlasts the brass one.
    choices:
      - { contentId: item.travel-ration, lootTableId: null, weight: 4, minimumQuantity: 2, maximumQuantity: 4 }
      - { contentId: item.pitch-torch, lootTableId: null, weight: 3, minimumQuantity: 1, maximumQuantity: 1 }
      - { contentId: item.lamp-oil, lootTableId: null, weight: 4, minimumQuantity: 2, maximumQuantity: 3 }
      - { contentId: item.brass-lantern, lootTableId: null, weight: 1, minimumQuantity: 1, maximumQuantity: 1, minDepth: 5 }
      - { contentId: item.lockpick, lootTableId: null, weight: 2, minimumQuantity: 1, maximumQuantity: 3 }
      - { contentId: item.ashen-potion, lootTableId: null, weight: 2, minimumQuantity: 1, maximumQuantity: 1, minDepth: 15 }
      - { contentId: item.iron-key, lootTableId: null, weight: 2, minimumQuantity: 1, maximumQuantity: 1, minDepth: 10 }
      - { contentId: item.warded-lantern, lootTableId: null, weight: 1, minimumQuantity: 1, maximumQuantity: 1, minDepth: 10 }
