  - kind: item
    id: item.thread-counts-needle
    name: Thread-Count's Needle
    glyph: "="
    color: "#c9d6a3"
    description: A sliver of pale metal, thin as a hair, that hums when a fight is close. It threads a current through whoever wears it and lets that current jump between blows.
    lore: "The Thread-Counts wove without hands, only tension. This is the one needle that outlasted its loom, and it still remembers how to find the next thread to pull."
    tags: [vault-reward, arcane, offense]
