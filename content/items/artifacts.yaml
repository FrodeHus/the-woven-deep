  - kind: item
    id: item.marias-grace
    name: Maria's Grace
    glyph: "("
    color: "#ffd9a0"
    description: A lantern that burns without oil and without end. Its flame cannot be lowered, banked, or blown out — the light it throws cannot be hidden, not even from what should stay hidden from.
    lore: "Maria carried it into places that were supposed to stay unlit. It never once asked her for fuel, and it never once let her hide. Some say that was the whole of the gift."
