  - kind: item
    id: item.last-cartographers-compass
    name: The Last Cartographer's Compass
    glyph: "="
    color: "#8fb0c9"
    description: A verdigris needle turns in its housing even where there is no north left to find. It knows the way back out better than it knows the way forward.
    lore: "The Cartographer who carried it mapped the Deep until the Deep stopped holding still for the mapping. This is the last thing they finished — a way home that does not care what it costs to see the dark clearly along the way."
    tags: [vault-reward, arcane, utility]
