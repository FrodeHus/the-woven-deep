name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The two jobs together cover everything `npm run verify` runs locally. They are split so
  # the static checks do not wait behind the engine suite; wall clock is the slower of the two.
  static:
    name: Static checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm run depcruise
      - run: npm run knip

  # The engine's `*cli.test.ts` suites spawn every demo script with `--verify`, so the pinned
  # hash replays are gated here. A separate demo step would re-run the identical commands.
  test:
    name: Tests (incl. determinism hash replays)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
